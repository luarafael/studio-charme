# API no Railway, a partir da raiz do monorepo.
#
# No painel: Settings → Root Directory vazio (raiz do repo).
# Healthcheck: GET /health

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @studio-charme/api db:generate && pnpm --filter @studio-charme/api build"

[deploy]
startCommand = "node apps/api/dist/server.js"
releaseCommand = "pnpm --filter @studio-charme/api db:migrate:deploy"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
