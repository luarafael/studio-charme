packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 ignora onlyBuiltDependencies e falha com ERR_PNPM_IGNORED_BUILDS.
# allowBuilds autoriza os scripts nativos que o monorepo realmente precisa:
#   argon2  -> hash de senha (API)
#   prisma  -> engines e client (API)
#   esbuild -> Vite, tsx e tsup
#   sharp   -> otimização de imagens (web)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
